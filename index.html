<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Sayings — Practice Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Daily Talk Guide</h1>
      <p>Two new lines a day — for practice, not just reading</p>
      <div class="auth-bar">
        <button id="signInBtn">Sign in with Google</button>
        <span id="userName"></span>
        <button id="signOutBtn" hidden>Sign out</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><span class="num" id="statTotal">0</span><span class="label">Learned</span></div>
      <div class="stat"><span class="num" id="statUsed">0</span><span class="label">Used aloud</span></div>
      <div class="stat"><span class="num" id="statStreak">0</span><span class="label">Days active</span></div>
    </div>

    <div class="section-title">Today <span class="badge" id="todayBadge"></span></div>
    <div id="todayList"></div>

    <button id="archiveToggle">Show earlier days ▾</button>
    <div id="archiveList"></div>

    <footer>New sayings unlock automatically each day, on your device's calendar date.</footer>
  </div>

  <script src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
